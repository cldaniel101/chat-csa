# Scrape manual do portal CSA/UEFS.
#
# Antes: rodava agendado e commitava o resultado em knowledge/raw/.
# Agora: disparo manual (workflow_dispatch), sem commit/push — a saída vira
# artifact. A base de produção vive no branch `data` e é alimentada pelo
# endpoint /kb/upload (com aval do time).
#
# O agente consumidor cita a URL de cada página (frontmatter `url`), nunca o
# caminho do arquivo Markdown — ver .consumer/AGENTS.md.
name: Scrape portal CSA

on:
  workflow_dispatch:

jobs:
  scrape:
    name: Scrape (artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala o uv e o Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Instala as dependências do projeto
        run: uv sync --frozen

      - name: Raspa o portal para knowledge/raw/
        run: uv run python scripts/scrape_portal.py

      - name: Publica a saída como artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-raw
          path: knowledge/raw/
          if-no-files-found: warn
