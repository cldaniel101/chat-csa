name: CI

on:
  push:
    branches:
      - main
      - development
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff & pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala o uv e o Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Instala as dependências do projeto
        run: uv sync --frozen --group dev

      - name: Lint do backend (ruff)
        run: uv run ruff check src

      - name: Testes automatizados do backend (pytest)
        run: uv run pytest tests/

  frontend:
    name: Frontend (oxlint & build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala o Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instala as dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Lint do frontend (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: Build do frontend (tsc + vite)
        working-directory: frontend
        run: npm run build
