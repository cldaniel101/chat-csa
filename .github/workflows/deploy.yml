# Deploy automático para a Vercel via GitHub Actions + Vercel CLI.
#
# Arquitetura simplificada (ADR-003):
#   - 2 projetos principais na Vercel: `chat-csa-api` (raiz) e `chat-csa-web` (frontend/)
#   - push em `main`        -> deploy com --prod (produção)
#   - push em `development` -> deploy de preview (URL de branch determinística)
#
# Segredos universais no GitHub:
#   - VERCEL_TOKEN: Token de deploy com acesso a ambos os projetos
#   - VERCEL_ORG_ID: ID do time proprietário dos projetos
#   - VERCEL_PROJECT_ID_API: ID do projeto backend
#   - VERCEL_PROJECT_ID_FRONTEND: ID do projeto frontend
name: Deploy

on:
  push:
    branches: [main, development]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Validação (CI)
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            workdir: .
            project_id_secret: VERCEL_PROJECT_ID_API
          - name: frontend
            workdir: frontend
            project_id_secret: VERCEL_PROJECT_ID_FRONTEND
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Valida credenciais da Vercel
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ORG_ID" ] || [ -z "$PROJECT_ID" ]; then
            echo "::error::Credenciais da Vercel ausentes para ${{ matrix.name }}. Configure VERCEL_TOKEN, VERCEL_ORG_ID e ${{ matrix.project_id_secret }} nos Secrets do GitHub (ver docs/handover.md)."
            exit 1
          fi

      - name: Deploy de Produção (`main`)
        if: github.ref == 'refs/heads/main'
        id: deploy_prod
        working-directory: ${{ matrix.workdir }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.name }}" = "frontend" ]; then
            EXTRA_ARGS="--build-env VITE_CONSUMER_URL=https://chat-csa-api.vercel.app"
          fi
          DEPLOY_URL=$(npx vercel@59 deploy --prod --yes --token "$VERCEL_TOKEN" $EXTRA_ARGS)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Deploy de Produção (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ambiente**: Produção (\`main\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL**: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy de Preview (`development`)
        if: github.ref == 'refs/heads/development'
        id: deploy_preview
        working-directory: ${{ matrix.workdir }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ matrix.name }}" = "frontend" ]; then
            EXTRA_ARGS="--build-env VITE_CONSUMER_URL=https://chat-csa-api-development.vercel.app"
          fi
          DEPLOY_URL=$(npx vercel@59 deploy --yes --token "$VERCEL_TOKEN" $EXTRA_ARGS)
          echo "url=$DEPLOY_URL" >> "$GITHUB_OUTPUT"

          # Atribui a URL fixa e limpa de preview da branch development (sem sufixo de time)
          ALIAS_HOST="chat-csa-${{ matrix.name }}-development.vercel.app"
          npx vercel@59 alias set "$DEPLOY_URL" "$ALIAS_HOST" --token "$VERCEL_TOKEN" || true

          echo "### 🔍 Deploy de Preview (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Ambiente**: Preview (\`development\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "- **URL Estável de Preview**: https://$ALIAS_HOST" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Deployment Específico**: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
