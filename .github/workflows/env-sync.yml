# Sincroniza as variáveis de ambiente do backend na Vercel a partir dos
# secrets do GitHub, reutilizando scripts/sync-vercel-env.sh.
#
# Sincroniza os dois projetos de API: o de produção (alvo escolhido no input) e
# o de staging, que é publicado com --prod e por isso consome sempre o alvo
# "production" do próprio projeto. Sem o token project-scoped do staging, esse
# passo é pulado com aviso (mesmo critério do deploy.yml).
#
# Execução manual: aba Actions -> "Sync Vercel env" -> Run workflow
# (escolha o ambiente: production | preview | development).
#
# Secrets usados (GitHub):
#   LLM_PROVIDER, LLM_MODEL, OLLAMA_MODEL, OLLAMA_BASE_URL, OLLAMA_API_KEY
#   KB_BACKEND, KB_REPO, KB_BRANCH, KB_ROOT, KB_TOKEN, KB_WRITE_TOKEN, KB_CACHE_TTL
#   VERCEL_TOKEN_API, VERCEL_ORG_ID_API, VERCEL_PROJECT_ID_API
#   VERCEL_TOKEN_API_PREVIEW, VERCEL_PROJECT_ID_API_PREVIEW
name: Sync Vercel env

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente alvo (production | preview | development)
        required: false
        default: production

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    # Sem o token project-scoped do staging, o passo do staging é pulado com
    # aviso em vez de falhar com "No existing credentials found".
    env:
      STAGING_READY: ${{ secrets.VERCEL_TOKEN_API_PREVIEW != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Instala o Vercel CLI
        run: npm i -g vercel@59

      - name: Monta o .env a partir dos secrets
        env:
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          KB_BACKEND: ${{ secrets.KB_BACKEND }}
          KB_REPO: ${{ secrets.KB_REPO }}
          KB_BRANCH: ${{ secrets.KB_BRANCH }}
          KB_ROOT: ${{ secrets.KB_ROOT }}
          KB_TOKEN: ${{ secrets.KB_TOKEN }}
          KB_WRITE_TOKEN: ${{ secrets.KB_WRITE_TOKEN }}
          KB_CACHE_TTL: ${{ secrets.KB_CACHE_TTL }}
        run: |
          # O link .vercel/project.json não serve ao CI: tokens project-scoped
          # não conseguem buscar settings por ele. O projeto é identificado por
          # VERCEL_ORG_ID/VERCEL_PROJECT_ID (no caminho REST, só o project id).
          rm -rf .vercel

          # Monta o .env apenas com os secrets definidos (o script pula ausentes)
          : > .env
          for key in LLM_PROVIDER LLM_MODEL OLLAMA_MODEL OLLAMA_BASE_URL OLLAMA_API_KEY \
                     KB_BACKEND KB_REPO KB_BRANCH KB_ROOT KB_TOKEN KB_WRITE_TOKEN KB_CACHE_TTL; do
            if [ -n "${!key:-}" ]; then
              printf '%s=%s\n' "$key" "${!key}" >> .env
            else
              echo "aviso: secret ${key} ausente — pulando"
            fi
          done
          test -s .env

      - name: Sincroniza o projeto de produção (`chat-csa-api`)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_API }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_API }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API }}
        run: ./scripts/sync-vercel-env.sh "${{ inputs.environment }}"

      - name: "Aviso: staging sem token"
        if: env.STAGING_READY != 'true'
        run: |
          echo "::warning::Secret VERCEL_TOKEN_API_PREVIEW ausente — sync do staging pulado. Crie o token project-scoped (docs/deploy.md, 'Bootstrap')."

      - name: Sincroniza o projeto de staging (`chat-csa-api-preview`)
        if: env.STAGING_READY == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN_API_PREVIEW }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID_API }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_API_PREVIEW }}
        run: |
          # O staging é publicado com --prod: o alvo é o "production" do projeto.
          ./scripts/sync-vercel-env.sh production