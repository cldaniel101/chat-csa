services:
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - consumer
    environment:
      VITE_CONSUMER_URL: "http://localhost:${CONSUMER_PORT:-8002}"
    restart: unless-stopped

  consumer:
    build: .
    ports:
      - "${CONSUMER_PORT:-8002}:8000"
    environment:
      AGENT_CONFIG_DIR: "${CONSUMER_CONFIG_DIR:-.consumer}"
      LLM_PROVIDER: "${CONSUMER_LLM_PROVIDER:-${LLM_PROVIDER:-openrouter}}"
      LLM_MODEL: "${CONSUMER_LLM_MODEL:-${LLM_MODEL:-nvidia/nemotron-3.5-lightning:free}}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}"
      LLM_MAX_TOKENS: "${LLM_MAX_TOKENS:-1024}"
      LLM_TIMEOUT_S: "${LLM_TIMEOUT_S:-60}"
      OPENAI_API_KEY: "${CONSUMER_OPENAI_API_KEY:-${OPENAI_API_KEY:-}}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      HOST: "${CONSUMER_HOST:-0.0.0.0}"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped
